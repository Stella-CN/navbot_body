# CMSIS-DAP / DAPLink; no hardware access during static validation.
source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32f4x.cfg]
# target/stm32f4x.cfg sets 2000 kHz; apply the board override after sourcing it.
adapter speed 1000
# No program, erase, reset or init command. Start only in an authorized session.
